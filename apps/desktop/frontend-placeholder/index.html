<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TOFO</title>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      body {
        background: #0b0c12;
        color: #8890b0;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        gap: 14px;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid #2a2d42;
        border-top-color: #a78bfa;
        animation: spin 0.8s linear infinite;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <p id="status">Starting…</p>
  </body>
</html>
