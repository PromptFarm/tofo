name: CI

# Runs on every PR: enforces the Conventional Commits format on the PR title
# (type(scope): description — feat/fix/docs/chore/ci/test/refactor) and runs
# promptfarm's test suite. This is separate from release.yml, which only
# builds platform artifacts on manual trigger or a version tag.
on:
  pull_request:
    types: [opened, edited, synchronize]
  push:
    branches: [main]

jobs:
  lint-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
          requireScope: false

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --dir apps/promptfarm test
